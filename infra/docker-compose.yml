services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-labelhub}
      MYSQL_USER: ${MYSQL_USER:-labelhub}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-labelhub}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-labelhub-root}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z # minio/minio was removed from Docker Hub; community fork, pinned
    command: server /data --address ":9000" --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-labelhub}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-labelhub-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: pgsty/mc@sha256:ce62c9053c69ce12a527a322345b5ad9f44b5f8a7b8189f82e516f2e3f30f1d8 # minio/mc was removed from Docker Hub; community fork, pinned by digest
    depends_on:
      - minio
    entrypoint: ["/bin/sh", "/scripts/init.sh"]
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-labelhub}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-labelhub-secret}
      S3_BUCKET: ${S3_BUCKET:-labelhub-exports}
    volumes:
      - ./minio/init.sh:/scripts/init.sh:ro

volumes:
  mysql-data:
  minio-data:
