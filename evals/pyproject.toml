[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "labelhub-evals"
version = "0.1.0"
description = "Offline evaluation harness for LabelHub AI pre-review (ADR-017, phase H1)."
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = []  # standard library only, so a run is reproducible anywhere Python runs

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["labelhub_evals*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
